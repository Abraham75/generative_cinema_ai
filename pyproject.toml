[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "generative-cinema-ai"
version = "0.1.0"
description = "Evidence-grounded screenplay-to-cinematic-recommendation foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "httpx>=0.27,<1", "mypy>=1.11,<2", "pytest>=8.3,<9", "ruff>=0.7,<1"]

[project.scripts]
generative-cinema = "generative_cinema_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/generative_cinema_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["generative_cinema_ai"]
